# Aver Engine CI.
#
# WHAT THIS IS FOR. Until it existed there was no CI of any kind, and tests/repo/SeparationTest.cpp
# says so in its own source: "There are already two source-scanning scripts in scripts/, and no CI
# to run either. A check nobody runs cannot fail, and a check that cannot fail is decoration."
# That is also the structural reason this repo has a documented history of describing tests that
# were never run. This is the smallest honest fix: build the engine, run every headless suite
# through CTest, on a machine that is not the author's.
#
# WHAT IT DELIBERATELY DOES NOT COVER -- read this before trusting a green tick:
#
#   * THE RENDER GATES. scripts/gates.ps1 is the pixel oracle and it needs a GPU. GitHub-hosted
#     Windows runners have none, so the only configuration that could run here is `warp` (the
#     software rasteriser), and a WARP-only gate run would compare against numbers recorded on a
#     Radeon. Those gates stay local and stay a human's call. A green tick here says NOTHING about
#     whether the renderer still draws the right pixels.
#   * THE C# / ROSLYN HALF beyond what the suites already reach. The managed build is pinned by
#     global.json (SDK 10.0.400) and a NuGet.config with only a vendored source; that arrangement
#     has been wrong about restoring without network before, so setup-dotnet is here to make the
#     failure loud rather than to claim the problem is solved.
#   * PACKAGING. scripts/stage-game.ps1 and verify-game.ps1 exist again, but verify-game runs the
#     staged package and its divergence gate compares two hosts' scene censuses -- both want a real
#     machine, and the allowlist audit is not a CI-shaped question either.
#
# EXIT CODES. Every script this workflow calls now speaks one table -- 0 ok, 1 failed, 2 usage,
# 3 environment (modules/core/include/aver/core/ErrorCodes.hpp, and docs/DIAGNOSTICS.md). That
# matters more here than locally: a 3 means the RUNNER is wrong (no build tree, no ctest) and a 1
# means the ENGINE is wrong, and before this they were the same number. They used to be worse than
# the same number -- test.ps1 forwarded ctest's own 8, and gates.ps1 exited the count of failed
# gates, so two failures exited 2, which this table spells "you invoked me wrong".
#
# RUNNER HISTORY. The runs of 2026-10-04/05 got to 770/841 of the build and failed restoring
# FSharp.Core on the cold package cache (fixed by scripting/Directory.Build.props); the test step
# never ran there. On 2026-10-12 both configurations were reproduced locally the way this file runs
# them -- a clean checkout, MSVC 19.44.35229 (the runner's), an empty NUGET_PACKAGES -- and built
# clean with 301/301 suites passing. What that could not reproduce: the runner has no GPU, so the
# suites that default to the hardware adapter exit 77 (Skipped), and the WARP ones run on Windows
# Server 2022's older WARP rather than this machine's.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  # One run per ref: a long build is not worth doing twice for a branch someone is pushing to.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.config }} build + suites
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      # BOTH CONFIGURATIONS, and not as belt-and-braces. Release compiles Jolt's asserts out, so a
      # physics bug that a Debug assert would have caught passes silently there; and the two trees
      # differ in floating-point codegen, which is why the render oracle keeps separate baselines.
      # Neither build substitutes for the other.
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Pin the .NET SDK global.json asks for
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DAVER_BUILD_TESTS=ON
        # Ninja, matching build.bat, so the CI tree is configured the same way a developer's is.
        # AVER_RHI_VULKAN stays OFF (its default): no Vulkan SDK on the runner, and a green Vulkan
        # build here would prove nothing anyway -- see docs on why a default build says nothing
        # about that backend.

      - name: Build
        shell: pwsh
        run: cmake --build build-ci --parallel

      - name: Run the headless suites
        shell: pwsh
        # scripts/test.ps1 is the same entry point a developer uses, pointed at the CI tree, so
        # there is one definition of "run the tests" rather than two that can drift.
        run: ./scripts/test.ps1 -BuildDir build-ci

      - name: Upload CTest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.config }}
          path: build-ci/Testing/Temporary/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # LINUX AND MACOS, the same build and the same suites as above, on the Vulkan backend (docs/PLATFORMS.md).
  #
  # Neither has a GPU. Linux gets Mesa's software Vulkan (lavapipe, from mesa-vulkan-drivers), so the
  # `.vulkan` CTest variants run on a real if slow device; macOS gets MoltenVK from the LunarG SDK, on
  # whatever Metal the runner exposes, and a suite that finds no device skips (77) exactly as the
  # hardware-adapter ones do on the Windows runner. Like the Windows job, a green tick here says nothing
  # about the pixels.
  #
  # SDL 3 and, on Linux, DXC are fetched by CMake at configure time (cmake/AvSdl.cmake, cmake/AvDxc.cmake)
  # unless a package provides them: Homebrew's sdl3 on macOS, the Vulkan SDK's DXC there. Ubuntu 24.04
  # packages neither.
  build-and-test-unix:
    name: ${{ matrix.os }} ${{ matrix.config }} build + suites
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        config: [Debug, Release]
    env:
      VULKAN_SDK_VERSION: 1.4.363.0

    steps:
      - uses: actions/checkout@v4

      - name: Pin the .NET SDK global.json asks for
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Linux packages (SDL's build dependencies, Ninja, software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libvulkan1 mesa-vulkan-drivers

      - name: macOS packages (Ninja, SDL 3, and the LunarG SDK for MoltenVK, the loader and DXC)
        if: runner.os == 'macOS'
        run: |
          brew install ninja sdl3
          curl -sSL -o vulkansdk.zip \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkansdk-macos-${VULKAN_SDK_VERSION}.zip"
          unzip -q vulkansdk.zip
          app=$(ls -d *.app | head -1)
          # `usr` copies the loader and MoltenVK into /usr/local, where a bare dlopen finds them.
          sudo "./${app}/Contents/MacOS/$(basename "${app}" .app)" \
            --root "$HOME/VulkanSDK/${VULKAN_SDK_VERSION}" --accept-licenses --default-answer \
            --confirm-command install com.lunarg.vulkan.core com.lunarg.vulkan.usr
          echo "VULKAN_SDK=$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DAVER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Run the headless suites
        shell: pwsh
        run: ./scripts/test.ps1 -BuildDir build-ci

      - name: Upload CTest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.os }}-${{ matrix.config }}
          path: build-ci/Testing/Temporary/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # PHYSICS DETERMINISM (docs/plans/wave11/WORLD_STATE_DEBUG.md, 2.9). The evidence for or against the sentence "the simulation is
  # bit-identical across Windows and macOS", which this repository does NOT make until this job says so.
  #
  # Builds only the two physics suites that hash the simulation, with AVER_PHYSICS_CROSS_PLATFORM=ON (Jolt's cross-platform
  # deterministic mode, and no FMA contraction in the engine's own fixed-step float code), on Windows and macOS, runs them, and keeps
  # the golden checkpoints PhysicsDeterminismTest writes (AVER_PHYSICS_GOLDEN_OUT: a precision line, then "step hash" lines, nothing
  # that names the platform). The compare job diffs the two files. A difference is a FINDING (continue-on-error), not a red build: the
  # likeliest cause is the vehicle driver aids in PhysicsVehicleExt.cpp, plain float arithmetic that two compilers may round
  # differently. The claim is made only when the files are equal AND the checkpoints are pasted into kGoldenSingle in the test.
  physics-determinism:
    name: physics determinism ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
      AVER_PHYSICS_GOLDEN_OUT: golden-${{ matrix.os }}.txt

    steps:
      - uses: actions/checkout@v4

      - name: Pin the .NET SDK global.json asks for
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      # The whole tree is configured (only two targets are built), so the macOS leg needs what the Unix job above installs.
      - name: macOS packages (Ninja, SDL 3, and the LunarG SDK for MoltenVK, the loader and DXC)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ninja sdl3
          curl -sSL -o vulkansdk.zip "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkansdk-macos-${VULKAN_SDK_VERSION}.zip"
          unzip -q vulkansdk.zip
          app=$(ls -d *.app | head -1)
          sudo "./${app}/Contents/MacOS/$(basename "${app}" .app)" --root "$HOME/VulkanSDK/${VULKAN_SDK_VERSION}" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core com.lunarg.vulkan.usr
          echo "VULKAN_SDK=$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS" >> "$GITHUB_ENV"

      # pwsh on both OSes (it is on every hosted runner): Git Bash's /usr/bin/link would shadow MSVC's link.exe on Windows.
      - name: Configure (cross-platform deterministic mode ON)
        shell: pwsh
        run: cmake -S . -B build-det -G Ninja -DCMAKE_BUILD_TYPE=Release -DAVER_BUILD_TESTS=ON -DAVER_PHYSICS_CROSS_PLATFORM=ON

      - name: Build the two physics suites
        shell: pwsh
        run: cmake --build build-det --target PhysicsStateTest PhysicsDeterminismTest --parallel

      - name: Run PhysicsStateTest
        shell: pwsh
        run: ./build-det/bin/PhysicsStateTest

      - name: Run PhysicsDeterminismTest
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./build-det/bin/PhysicsDeterminismTest

      - name: Keep the golden checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-golden-${{ matrix.os }}
          path: golden-${{ matrix.os }}.txt
          if-no-files-found: warn

  physics-determinism-compare:
    name: physics determinism, Windows against macOS
    needs: physics-determinism
    if: always()
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: physics-golden-*
          merge-multiple: true

      - name: Diff the checkpoints
        shell: bash
        run: |
          ls -l
          echo "--- windows-2022"; cat golden-windows-2022.txt
          echo "--- macos-15";     cat golden-macos-15.txt
          if diff golden-windows-2022.txt golden-macos-15.txt; then
            echo "EQUAL: Windows and macOS hashed the golden scene identically. Paste these into kGoldenSingle in PhysicsDeterminismTest.cpp."
          else
            echo "DIFFERENT: a finding, not a claim. The cross-platform determinism claim stays unmade."
            exit 1
          fi
